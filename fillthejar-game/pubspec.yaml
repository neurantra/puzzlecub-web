name: fill_the_jar
description: A cheerful geometric puzzle for iOS and Android.
publish_to: none
version: 1.0.2+12
environment:
  sdk: ^3.12.0
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.5
  audioplayers: ^6.6.0
  google_mobile_ads: ^8.0.0
  in_app_review: ^2.0.12
  url_launcher: ^6.3.2
  firebase_core: ^4.8.0
  firebase_auth: ^6.6.1
  firebase_database: ^12.5.0
  purchases_flutter: ^10.13.2
dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/pictures/
    - assets/materials/
    - assets/levels.json
    - assets/audio/
    - assets/branding/icon.png
    - assets/family/
